version: '3.8'

services:
  churn-prediction-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro  # Mount models directory as read-only
      - ../logs:/app/logs         # Mount logs directory for writing
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/model/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    
  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - churn-prediction-api
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: churn-prediction-network